<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конструктор расписания</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts/constructor.js" defer></script>
</head>
<body class="page">

<header class="header">
    <a href="index.html" class="header__logo-link">
        <img src="../images/logo.png" alt="Logo" class="header__logo">
    </a>
    <nav class="header__nav-container">
        <ul class="nav__list">
            <li class="nav__item"><a href="platforms.html" class="nav__link">Музыкальные сервисы</a></li>
            <li class="nav__item"><a href="library.html" class="nav__link">Моя медиатека</a></li>
            <li class="nav__item"><a href="stats.html" class="nav__link">Статистика</a></li>
            <li class="nav__item"><a href="constructor.html" class="nav__link">ToDo</a></li>
        </ul>
    </nav>
</header>

<main class="main-content">
    <section class="section section--constructor">
        <h2 class="section__title">Конструктор расписания</h2>

        <form id="scheduleForm" class="form">
            <label for="days">Количество дней в неделе:</label>
            <select id="days" name="days" class="form__select">
                <option value="5">5-дневная</option>
                <option value="6">6-дневная</option>
            </select>

            <label for="lessons">Максимальное количество уроков в день:</label>
            <input type="number" id="lessons" name="lessons" min="1" max="10" class="form__input" required>

            <label for="language">Язык расписания:</label>
            <select id="language" name="language" class="form__select">
                <option value="ru">Русский</option>
                <option value="en">Английский</option>
            </select>

            <button type="submit" class="form__button form__button--main">Создать расписание</button>
            <div class="form__button-group">
                <button type="button" id="saveSettings" class="form__button form__button--small">Сохранить</button>
                <button type="button" id="reset-settings" class="form__button form__button--small">Сбросить</button>
            </div>
        </form>

        <div id="scheduleOutput" class="schedule-output"></div>
    </section>
</main>

<footer class="footer">
    <p class="footer__text">&copy; 2024 Музыкальный агрегатор. Все права защищены.</p>
</footer>

</body>
</html>
